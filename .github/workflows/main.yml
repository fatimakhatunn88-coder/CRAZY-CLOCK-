name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: for f in *.zip; do unzip -q "$f" -d work; done
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.7/bin" >> "$GITHUB_PATH"
      - run: gradle assembleDebug --no-daemon
        working-directory: work/CrazyClock-Android
      - uses: actions/upload-artifact@v4
        with:
          name: CrazyClock-apk
          path: work/CrazyClock-Android/app/build/outputs/apk/debug/app-debug.apk
